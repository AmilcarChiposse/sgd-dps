[project]
name = "sgd-dps"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.0",
    "sqlalchemy>=2.1.1",
]

[tool.fastapi]
entrypoint = "backend.app.main:app"
